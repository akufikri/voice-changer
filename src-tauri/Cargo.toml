[package]
name = "voice-changer"
version = "0.1.0"
description = "AI Voice Changer for Google Meet"
authors = ["you"]
edition = "2021"

[lib]
name = "voice_changer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
cpal = "0.15"
rubato = "0.15"
ringbuf = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
base64 = "0.22"
bytes = "1"
async-trait = "0.1"
dirs = "5"
minimp3 = "0.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
